# The single mxf8 solution from the residual #423 cell, with the peeled first iteration off so the
# loop body stands alone: MT64x64x128 PGR1 PLR0 SIA0 LOKMN unsplit TDMFuse1 LDSSI0 MIWT2 VW1.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: False
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationPrintValids: False
  PruneSparseMode: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 0
  EnqueuesPerSync: 1
  PrintWinnersOnly: False
  Architecture: gfx1250
  KeepBuildTmp: True
  OutputLoopIR: True
  PrintLevel: 2

BenchmarkProblems:
  -
    -
      OperationType: GEMM
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: e8
      DataTypeMXSB: e8

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  2, 2,  2, 2]

        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [true]
        - HalfPLR: [0]
        - TDMInst: [3]
        - TDMIterateMode: [-1]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMetadata: [0]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [false]
        - DirectToVgprSparseMetadata: [false]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [false]
        - UseSubtileImpl: [false]
        - UseLoopModel: [true]
        - InitCIterWmma: [0]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - DepthU: [128]
        - AssertSummationElementMultiple: [128]
        - LDSTrInst: [False]
        - TDMFuse: [0]
        - TDMSplitA: [0]
        - TDMSplitB: [0]
        - LDSSegmentInterleave: [0]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [0]
        - StaggerU: [0]
        - ScheduleIterAlg: [0]
        - WmmaInnerOrder: [1]
        - WmmaOuterOrder: [0]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 1024]
