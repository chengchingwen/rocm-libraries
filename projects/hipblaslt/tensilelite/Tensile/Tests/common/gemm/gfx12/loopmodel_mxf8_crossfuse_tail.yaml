TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: False
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationPrintValids: False
  PruneSparseMode: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 0
  EnqueuesPerSync: 1
  PrintWinnersOnly: False
  Architecture: gfx1250
  KeepBuildTmp: True
  OutputLoopIR: True
  PrintLevel: 2

BenchmarkProblems:
  - - OperationType: GEMM
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: true
      TransposeA: true
      TransposeB: false
      UseBeta: true
      Batched: true
      Activation: false
      SupportUserArgs: true
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: e8
      DataTypeMXSB: e8
    - InitialSolutionParameters: null
      BenchmarkCommonParameters:
      - KernelLanguage:
        - Assembly
      ForkParameters:
      - MatrixInstruction:
        - [16, 16, 128, 1, 1, 2, 2, 2, 2]
      - UseSgprForGRO: [0]
      - ForceDisableShadowInit: [true]
      - HalfPLR: [0]
      - DepthU: [256]
      - TDMInst: [3]
      - TDMIterateMode: [-1]
      - TransposeLDS: [-1]
      - LdsPadA: [-1]
      - LdsPadB: [-1]
      - LdsBlockSizePerPadA: [-1]
      - LdsBlockSizePerPadB: [-1]
      - LdsPadMetadata: [0]
      - LDSTrInst: [false]
      - StaggerU: [0]
      - ScheduleIterAlg: [4]
      - PrefetchLocalRead: [1]
      - PrefetchGlobalRead: [2]
      - PrefetchGL2: [0]
      - ClusterDim: [[1,1]]
      - StoreRemapVectorWidth: [0]
      - GlobalSplitU: [1]
      - GlobalSplitUAlgorithm: ["MultipleBuffer"]
      - GlobalReadVectorWidthA: [-1]
      - GlobalReadVectorWidthB: [-1]
      - VectorWidthA: [1]
      - VectorWidthB: [1]
      - LocalReadVectorWidth: [-1]
      - LDSSegmentInterleave: [0]
      - 1LDSBuffer: [0]
      - SourceSwap: [false]
      - DirectToVgprSparseMetadata: [false]
      - WorkGroupMapping: [1]
      - StoreVectorWidth: [-1]
      - DirectToVgprA: [false]
      - DirectToVgprB: [false]
      - WavefrontSize: [32]
      - ExpandPointerSwap: [false]
      - UseSubtileImpl: [false]
      - UseLoopModel: [true]
      - TDMFuse: [1, 2, 3]
      - TDMSplitA: [0,1,2]
      - TDMSplitB: [0,1,2]
      - LoopOrder: ["KMNKMN", "MKNMKN"]
      BenchmarkForkParameters: null
      JoinParameters: null
      BenchmarkJoinParameters: null
      BenchmarkFinalParameters:
      - ProblemSizes:
        - Exact: [256, 256, 1, 256]
        - Exact: [256, 256, 1, 416]   # tail: DepthU + MatrixInstK + ASEM(32) -- the smallest legal partial slab
        - Exact: [257, 129, 1, 416]   # edge+tail: both forks clamp one descriptor
