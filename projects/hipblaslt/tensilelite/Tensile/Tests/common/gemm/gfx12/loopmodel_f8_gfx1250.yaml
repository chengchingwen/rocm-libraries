TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  Architecture: gfx1250
  CpuThreads: 1
  KeepBuildTmp: True
  OutputLoopIR: True
  PrintLevel: 2
  DataInitTypeA: 3
  DataInitTypeB: 3

BenchmarkProblems:

  -
    -
      OperationType: GEMM
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  2, 2,  1, 1]
        - DepthU: [256]
        - AssertSummationElementMultiple: [256]
        - WavefrontSize: [32]
        - PrefetchGlobalRead: [1, 2]
        - PrefetchLocalRead: [0, 1]
        - StaggerU: [0, 32]
        - ScheduleIterAlg: [0, 4]
        - UseSubtileImpl: [false]
        - UseLoopModel: [true]
        - TDMInst: [3]
        - LDSTrInst: [false]
        - SourceSwap: [false]
        - ExpandPointerSwap: [false]
        - LoopOrder: [KMN, KNM, MKN, MNK, NKM, NMK]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 1024]
          - Exact: [256, 256, 1, 512]
          - Exact: [256, 256, 1, 256]

  -
    -
      OperationType: GEMM
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 64, 1,  1,  2, 2,  1, 1]
        - DepthU: [128]
        - AssertSummationElementMultiple: [128]
        - WavefrontSize: [32]
        - PrefetchGlobalRead: [1, 2]
        - PrefetchLocalRead: [0, 1]
        - StaggerU: [0, 32]
        - ScheduleIterAlg: [0, 4]
        - UseSubtileImpl: [false]
        - UseLoopModel: [true]
        - TDMInst: [3]
        - LDSTrInst: [true]
        - SourceSwap: [false]
        - ExpandPointerSwap: [false]
        - LoopOrder: [KMN, KNM, MKN, MNK, NKM, NMK]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 512]
          - Exact: [256, 256, 1, 256]
          - Exact: [256, 256, 1, 128]

  -
    -
      OperationType: GEMM
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  2, 2,  2, 2]
          - [16, 16, 128, 1,  1,  1, 1,  2, 2]
        - DepthU: [256]
        - AssertSummationElementMultiple: [256]
        - WavefrontSize: [32]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [0, 1]
        - StaggerU: [0]
        - ScheduleIterAlg: [0, 4]
        - InitCIterWmma: [1]
        - UseSubtileImpl: [false]
        - UseLoopModel: [true]
        - TDMInst: [3]
        - LDSTrInst: [false]
        - SourceSwap: [false]
        - ExpandPointerSwap: [false]
        - VectorWidthA: [-1, 2]
        - VectorWidthB: [-1, 2]
        - TDMSplitA: [0, 1, 2]
        - TDMSplitB: [0, 1, 2]
        - LoopOrder: [KMN, KMKNMN, KMNKMN, KMNMNK]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 512]
          - Exact: [256, 256, 1, 256]
