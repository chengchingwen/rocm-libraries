# One failing bf16 cell from build_lm_bf16.log: TN, MT64x64x64, MIWT2_2, PGR2/PLR1, SIA0,
# TDMSplitA=1 TDMSplitB=0, LoopOrder MKN -- the PLR1 x split x K-inner signature.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  Architecture: gfx1250
  CpuThreads: 1
  KeepBuildTmp: True
  OutputLoopIR: True
  PrintLevel: 2

BenchmarkProblems:
  -
    -
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1,  2, 2,  2, 2]
        - DepthU: [64]
        - AssertSummationElementMultiple: [64]
        - WavefrontSize: [32]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - StaggerU: [32]
        - ScheduleIterAlg: [0]
        - UseSubtileImpl: [false]
        - UseLoopModel: [true]
        - TDMInst: [3]
        - TDMSplitA: [1]
        - TDMSplitB: [0]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - LDSTrInst: [false]
        - SourceSwap: [false]
        - ExpandPointerSwap: [false]
        - WmmaInnerOrder: [3]
        - WmmaOuterOrder: [0]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
