#
# The first UseLoopModel config with a TAIL LOOP (#94).  Every other loopmodel_*.yaml pins
# AssertSummationElementMultiple to DepthU, which derives NoTailLoop=True, so the scaffold's tail
# has never run under this path.  Here ASEM=32 against DepthU=64 leaves a 32-element remainder.
#
# The K sizes are chosen to separate the two arms the handoff analysis distinguishes:
#   K=32   T=0 -- main loop skipped entirely; the tail does all the work
#   K=96   T=1 -- below the peel depth at PGR=2, at it for PGR=1
#   K=160  T=2 -- steady path, few trips
#   K=288  T=4 -- steady path, several trips
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  Architecture: gfx1250
  CpuThreads: 1
  KeepBuildTmp: True
  OutputLoopIR: True
  PrintLevel: 2

BenchmarkProblems:

  -
    -
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1,  2, 2,  1, 1]
        - DepthU: [64]
        - AssertSummationElementMultiple: [32]
        - WavefrontSize: [32]
        - PrefetchGlobalRead: [1, 2]
        - PrefetchLocalRead: [0, 1]
        - StaggerU: [0]
        - ScheduleIterAlg: [0, 4]
        - UseSubtileImpl: [false]
        - UseLoopModel: [true]
        - TDMInst: [3]
        - LDSTrInst: [true]
        - SourceSwap: [false]
        - ExpandPointerSwap: [false]
        - WmmaInnerOrder: [1, 4]
        - WmmaOuterOrder: [0]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 32]
          - Exact: [256, 256, 1, 96]
          - Exact: [256, 256, 1, 160]
          - Exact: [256, 256, 1, 288]
